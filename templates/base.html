<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Mesa de Ayuda{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; color: #222; }
        nav a { margin-right: 1rem; text-decoration: none; color: #2c5aa0; }
        nav a:hover { text-decoration: underline; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
        th { background: #f4f4f4; }
        form p { margin-bottom: 0.8rem; }
        button, .btn { background: #2c5aa0; color: white; border: none; padding: 0.5rem 1rem;
                       border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
        button:hover, .btn:hover { background: #1e3f73; }
        .error { color: #c0392b; }
        .msg { padding: 0.5rem 1rem; border-radius: 4px; background: #e8f4ea; margin: 0.5rem 0; }
        .msg.error { background: #fdecea; }
        .origen { color: #2e7d32; }
        .origen.respaldo { color: #e65100; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'tickets:lista_tickets' %}">Tickets</a>
        <a href="{% url 'tecnicos:lista_tecnicos' %}">Técnicos</a>
        <a href="{% url 'tickets:preguntas_frecuentes' %}">Preguntas frecuentes</a>
        <a href="{% url 'tickets:asistente_ia' %}">Asistente de IA</a>
    </nav>
    <hr>
    {% if messages %}{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}{% endif %}
    {% block contenido %}{% endblock %}
</body>
</html>
