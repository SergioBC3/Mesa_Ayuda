{% extends 'base.html' %}
{% block contenido %}
<h1>Eliminar técnico</h1>
<p>¿Seguro que deseas eliminar "{{ tecnico.nombre }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn">Sí, eliminar</button>
    <a href="{% url 'tecnicos:detalle_tecnico' tecnico.id %}">Cancelar</a>
</form>
{% endblock %}
