{% extends "base.html" %}
{% block titulo %}Técnicos{% endblock %}
{% block contenido %}
    <h1>Técnicos</h1>
    <ul>
        {% for t in tecnicos %}
            <li><a href="{% url 'tecnicos:detalle_tecnico' t.id %}">{{ t.nombre }}</a> - {{ t.especialidad }}</li>
        {% empty %}
            <li>No hay técnicos registrados. Agrégalos desde /admin/.</li>
        {% endfor %}
    </ul>
{% endblock %}
